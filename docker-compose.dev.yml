services:
  postgres:
    image: postgres:16
    container_name: nojectserver-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: nojectserver_user
      POSTGRES_PASSWORD: nojectserver_password
      POSTGRES_DB: nojectserver_db_dev
    ports:
      - "5432:5432"
    volumes:
      - nojectserver_postgres_data_dev:/var/lib/postgresql/data

volumes:
  nojectserver_postgres_data_dev:
